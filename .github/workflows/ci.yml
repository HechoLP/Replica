name: CI

on:
  pull_request:
  push:
    branches:
      - chore/project-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore Replica.sln

      - name: Verify formatting
        run: dotnet format Replica.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Replica.sln -c Release --no-restore

      - name: Test
        run: dotnet test Replica.sln -c Release --no-build --logger "trx;LogFilePrefix=replica" --results-directory TestResults

      - name: Audit vulnerable packages
        run: dotnet list Replica.sln package --vulnerable --include-transitive --no-restore

      - name: Verify release automation contracts
        shell: powershell
        run: ./scripts/test-release-automation.ps1

      - name: Verify public documentation
        shell: powershell
        run: ./scripts/test-public-documentation.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7

  macos-build-and-test:
    name: macOS ${{ matrix.architecture }} build and test
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x64]

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Packages.props
            src/Replica.Core/Replica.Core.csproj
            src/Replica.Storage/Replica.Storage.csproj
            src/Replica.Mac.Infrastructure/Replica.Mac.Infrastructure.csproj
            src/Replica.Mac/Replica.Mac.csproj
            tests/Replica.Mac.Tests/Replica.Mac.Tests.csproj

      - name: Restore macOS projects
        run: dotnet restore tests/Replica.Mac.Tests/Replica.Mac.Tests.csproj

      - name: Verify macOS formatting
        run: dotnet format tests/Replica.Mac.Tests/Replica.Mac.Tests.csproj --verify-no-changes --no-restore

      - name: Build macOS projects
        run: dotnet build tests/Replica.Mac.Tests/Replica.Mac.Tests.csproj -c Release --no-restore

      - name: Test macOS projects
        run: dotnet test tests/Replica.Mac.Tests/Replica.Mac.Tests.csproj -c Release --no-build --logger "trx;LogFilePrefix=replica-macos" --results-directory TestResults

      - name: Read project version
        id: project-version
        shell: pwsh
        run: |
          $version = (dotnet msbuild src/Replica.Mac/Replica.Mac.csproj -getProperty:Version -nologo).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Project version is unavailable.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and verify architecture-specific DMG
        shell: pwsh
        run: ./scripts/build-macos-release.ps1 -Version ${{ steps.project-version.outputs.version }} -Architecture ${{ matrix.architecture }} -OutputDirectory artifacts/macos-release/${{ matrix.architecture }}

      - name: Verify macOS package checksums
        shell: pwsh
        run: |
          $architecture = '${{ matrix.architecture }}'
          $name = "Replica-macOS-$architecture.dmg"
          $directory = "artifacts/macos-release/$architecture"
          $expected = (Get-Content -LiteralPath "$directory/$name.sha256" -Raw).Trim().Split(' ', [StringSplitOptions]::RemoveEmptyEntries)[0]
          $actual = (Get-FileHash -LiteralPath "$directory/$name" -Algorithm SHA256).Hash
          if (!$actual.Equals($expected, [StringComparison]::OrdinalIgnoreCase)) { throw "macOS $architecture CI package hash mismatch." }

      - name: Upload verified macOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-ci-package-${{ matrix.architecture }}
          path: |
            artifacts/macos-release/${{ matrix.architecture }}/Replica-macOS-${{ matrix.architecture }}.dmg
            artifacts/macos-release/${{ matrix.architecture }}/Replica-macOS-${{ matrix.architecture }}.dmg.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload macOS test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-test-results-${{ matrix.architecture }}
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7
