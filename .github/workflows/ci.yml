name: CI

on:
  pull_request:
  push:
    branches:
      - chore/project-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore Replica.sln

      - name: Verify formatting
        run: dotnet format Replica.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Replica.sln -c Release --no-restore

      - name: Test
        run: dotnet test Replica.sln -c Release --no-build --logger "trx;LogFilePrefix=replica" --results-directory TestResults

      - name: Audit vulnerable packages
        run: dotnet list Replica.sln package --vulnerable --include-transitive --no-restore

      - name: Verify release automation contracts
        shell: powershell
        run: ./scripts/test-release-automation.ps1

      - name: Verify public documentation
        shell: powershell
        run: ./scripts/test-public-documentation.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7
